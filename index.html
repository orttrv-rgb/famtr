function linked(a,b){const seen=new Set([a.id]);let q=[a.id];while(q.length){const n=[];for(const i of q){const p=P(i);for(const x of [p.f,p.m,p.sp,...S.people.filter(c=>c.f===i||c.m===i).map(c=>c.id)])if(x&&P(x)&&!seen.has(x)){seen.add(x);n.push(x)}}q=n}return seen.has(b.id)}
function bd(a,b){const A=anc(a.id),B=anc(b.id);let m=null;for(const k in A)if(k in B){const s=A[k]+B[k];if(m===null||s<m)m=s}return m}
function deg(a,b){let n;if(a.id===b.id)return{n:0,k:''};if(a.sp===b.id)return{n:0,k:'配偶者'};
 if((n=bd(a,b))!=null)return{n,k:'血族'};
 const sa=a.sp&&P(a.sp),sb=b.sp&&P(b.sp);
 if([a.f,a.m].some(x=>x&&P(x)&&P(x).sp===b.id))return{n:1,k:'姻族'};
 if(sa&&(n=bd(sa,b))!=null)return{n,k:'姻族'};
 if(sb&&(n=bd(a,sb))!=null)return{n,k:'姻族'};
 return null}
function dgOf(p){const b=base();if(!b)return'';const d=deg(b,p);return d?`<i class="dg">${d.n}</i>`:''}
function degHtml(p,b){const d=deg(b,p);return d?`<div class="cap" style="font-size:15px">親等: ${d.k==='配偶者'?'なし（配偶者）':d.n+'親等'+(d.k?'（'+d.k+'）':'')}</div>`:''}
function route(a,b){if(a.id===b.id||a.sp===b.id||blood(a,b))return null;
 const sa=a.sp&&P(a.sp),sb=b.sp&&P(b.sp),sl=x=>x.sex==='m'?'夫':x.sex==='f'?'妻':'配偶者';
 const par=[a.f,a.m].map(x=>x&&P(x)).filter(Boolean).find(x=>x.sp===b.id);let t;
 if(par)return{t:(par.sex==='m'?'父':'母')+'の'+sl(b),s:''};
 if(sa&&(t=blood(sa,b)))return{t:sl(sa)+'の'+t,s:sl(sa)+'側'};
 if(sb&&(t=blood(a,sb)))return{t:t+'の'+sl(b),s:''};
 if(sa&&sb&&(t=blood(sa,sb)))return{t:sl(sa)+'の'+t+'の'+sl(b),s:sl(sa)+'側'};
 return null}
function sdOf(p){const b=base();if(!b)return'';const r=route(b,p);return r&&r.s?`<i class="sd">${r.s}</i>`:''}
function routeHtml(p,b){const r=route(b,p);return r?`<div class="cap" style="font-size:15px">経路: ${esc(r.t)}</div>`:''}
function rel(a,b){if(a.id===b.id)return'本人';
 if(a.sp===b.id)return b.sex==='m'?'夫':b.sex==='f'?'妻':'配偶者';
 let t=blood(a,b);if(t)return t;
 const M=b.sex==='m',F=b.sex==='f',sa=a.sp&&P(a.sp),sb=b.sp&&P(b.sp),sib=['兄','姉','弟','妹','兄弟','姉妹','兄・姉','弟・妹','きょうだい'];
 if([a.f,a.m].some(x=>x&&P(x)&&P(x).sp===b.id))return M?'継父':F?'継母':'継親';
 if(sa){t=blood(sa,b);if(t){if(t==='息子'||t==='娘'||t==='子')return'継子';return IN[t]||'配偶者の'+t}}
 if(sb){t=blood(a,sb);if(t){
  if(t==='息子'&&F)return'嫁';if(t==='娘'&&M)return'婿';
  if(['兄','姉','兄・姉'].includes(t))return M?'義兄':F?'義姉':'義兄・義姉';
  if(['弟','妹','弟・妹'].includes(t))return M?'義弟':F?'義妹':'義弟・義妹';
  if(['兄弟','姉妹','きょうだい'].includes(t))return M?'義兄弟':F?'義姉妹':'義きょうだい';
  if(/^(おじ|おば|叔|伯)/.test(t))return F?'義理のおば':'義理のおじ';
  return t+'の'+(M?'夫':F?'妻':'配偶者')}}
 if(sa&&sb){t=blood(sa,sb);if(t){if(M&&a.sex==='m'&&sib.includes(t))return'相婿';return'配偶者の'+t+'の配偶者'}}
 return linked(a,b)?'姻族':null}
/* ---- 家系図レイアウト ---- */
const NW=96,NH=58,GX=16,CG=10,RY=104;
function layout(nf){const pp=S.people,gen={},comp={};let cid=0;
 pp.forEach(p=>{if(p.id in gen)return;gen[p.id]=0;comp[p.id]=cid;const q=[p.id];
  while(q.length){const i=q.shift(),x=P(i),nb=[];
   [x.f,x.m].forEach(y=>y&&P(y)&&nb.push([y,-1]));pp.forEach(c=>{if(c.f===i||c.m===i)nb.push([c.id,1])});if(x.sp&&P(x.sp))nb.push([x.sp,0]);
   nb.forEach(([y,dg])=>{if(!(y in gen)){gen[y]=gen[i]+dg;comp[y]=cid;q.push(y)}})}cid++});
 const mn={};pp.forEach(p=>{mn[comp[p.id]]=Math.min(mn[comp[p.id]]??99,gen[p.id])});
 const unit={},units=[];
 pp.forEach(p=>{if(unit[p.id])return;const s=p.sp&&P(p.sp),m=s&&!unit[s.id]?[p,s]:[p];
  if(m.length>1&&m[0].sex==='m'&&m[1].sex!=='m')m.reverse();if(m.length>1&&m[0].sw)m.reverse();const u={m,seen:0};m.forEach(x=>unit[x.id]=u);units.push(u)});
 const kidsOf=u=>{const r=[];pp.filter(c=>u.m.some(x=>c.f===x.id||c.m===x.id)).sort(cmp).forEach(c=>{const k=unit[c.id];if(!k.seen&&!r.includes(k))r.push(k)});return r};
 function measure(u){u.seen=1;u.k=[];for(const k of kidsOf(u))if(!k.seen){measure(k);u.k.push(k)}
  u.nw=u.m.length*NW+(u.m.length-1)*CG;u.kw=u.k.reduce((s,k)=>s+k.w,0)+GX*Math.max(0,u.k.length-1);u.w=Math.max(u.nw,u.kw)}
 const pos={};
 function place(u,left){u.cx=left+u.w/2;let x=left+(u.w-u.kw)/2;u.k.forEach(k=>{place(k,x);x+=k.w+GX});
  u.m.forEach((p,i)=>pos[p.id]={x:u.cx-u.nw/2+i*(NW+CG),y:(gen[p.id]-mn[comp[p.id]])*RY+12})}
 const hasPar=u=>u.m.some(x=>(x.f&&P(x.f))||(x.m&&P(x.m)));
 let left=12;const run=u=>{if(u.seen)return;measure(u);place(u,left);left+=u.w+GX*2};
 units.filter(u=>!hasPar(u)).sort((a,b)=>cmp(a.m[0],b.m[0])).forEach(run);units.forEach(run);
 let H=0;for(const k in pos)H=Math.max(H,pos[k].y+NH);
 const W=left+12;if(!nf)for(const k in pos){if(S.fx)pos[k].x=W-pos[k].x-NW;if(S.fy)pos[k].y=H+12-NH-pos[k].y}
 return{pos,W,H:H+24}}

function render(){
 const b=base(),mn=$('#main'),sl=mn.scrollLeft,st=mn.scrollTop;

 let h='';
 if(S.view==='tree'){const L=layout(),z=S.zoom;let svg='';
  const mid=p=>({x:p.x+NW/2,y:p.y+NH/2});
  S.people.forEach(c=>{const f=P(c.f)&&L.pos[c.f],m=P(c.m)&&L.pos[c.m],q=L.pos[c.id];if(!q)return;
   let ax,ay;if(f&&m){ax=(f.x+m.x)/2+NW/2;ay=f.y+NH/2}else if(f||m){const p=f||m;ax=p.x+NW/2;ay=S.fy?p.y:p.y+NH}else return;
   const cy=S.fy?q.y+NH:q.y,my=S.fy?cy+20:cy-20;svg+=`<path d="M${ax} ${ay}V${my}H${q.x+NW/2}V${cy}" fill="none" stroke="var(--ln)" stroke-width="2.5"/>`;});

  const nodes=S.people.map(p=>{const q=L.pos[p.id];return`<div class="nd ${p.sex||'o'} ${p.id===S.base?'base':''} ${pick?'pk':''}" data-id="${p.id}" style="left:${q.x}px;top:${q.y}px">${dgOf(p)}${sdOf(p)}<b>${esc(p.name)}</b>${p.maiden?`<small class="mn">旧 ${esc(p.maiden)}</small>`:''}<small>${tagOf(p)}</small></div>`}).join('');
  h=`<div style="width:${L.W*z}px;height:${(L.H+80)*z}px"><div style="position:relative;width:${L.W}px;height:${L.H}px;transform:scale(${z});transform-origin:0 0"><svg width="${L.W}" height="${L.H}" style="position:absolute;left:0;top:0">${svg}</svg>${nodes}</div></div>

 }else{
  const g=layout(1),pp=[...S.people].sort((x,y)=>(g.pos[x.id].y-g.pos[y.id].y)||((bv(x)||9999)-(bv(y)||9999)));let last=-1;
  pp.forEach(p=>{const y=g.pos[p.id].y;if(y!==last){h+=`<div class="gh">${Math.round((y-12)/RY)+1}段目</div>`;last=y}
   h+=`<div class="li ${p.sex||'o'}" data-id="${p.id}"><div class="t"><b>${esc(p.name)}</b><small>${p.maiden?'旧姓 '+esc(p.maiden)+'　':''}${esc(fmtB(p.birth))}${p.note?' '+esc(p.note.slice(0,20)):''}</small></div>${b?`<span class="tag">${tagOf(p)}</span>`:''}</div>`});
  h+='<div style="height:90px"></div>'}
 mn.innerHTML=h+'<button class="fab" onclick="openForm()">＋ 追加</button>';

 if(!render.first&&S.view==='tree'){render.first=1;const n=b&&mn.querySelector('.base');if(n)mn.scrollLeft=n.offsetLeft*S.zoom-mn.clientWidth/2+50;else mn.scrollLeft=(mn.scrollWidth-mn.clientWidth)/2}}

function openForm(id,pre,cb){const p=id?P(id):Object.assign({name:'',maiden:'',sex:'',birth:'',note:'',f:'',m:'',sp:''},pre||{});FS=p.sex||'';openForm.cb=cb;openForm.id=id||null;

try{DB=localStorage.getItem('kazoku-db')||''}catch(e){}
{const m=location.hash.match(/db=([^&]+)/);if(m){DB=decodeURIComponent(m[1]);try{localStorage.setItem('kazoku-db',DB)}catch(e){}try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}}
const dbUrl=()=>DB.replace(/\/+$/,'')+'/kazoku/people.json';
const stat=t=>{const e=$('#st');if(e)e.textContent=t};
const J=p=>JSON.stringify(p,Object.keys(p).sort());
const toMap=a=>{const o={};a.forEach(p=>o[p.id]=J(p));return o};
async function sync(){if(!DB||snap===null)return;const cur=toMap(S.people),ch={};
 for(const k in cur)if(snap[k]!==cur[k])ch[k]=JSON.parse(cur[k]);for(const k in snap)if(!(k in cur))ch[k]=null;
 if(!Object.keys(ch).length)return;pend++;
 try{const r=await fetch(dbUrl(),{method:'PATCH',body:JSON.stringify(ch)});if(!r.ok)throw 0;snap=cur;stat('● 共有中')}catch(e){stat('△ 通信エラー')}finally{pend--;lastW=Date.now()}}
async function pull(first){if(!DB)return;if(!first){await sync();if(pend||Date.now()-lastW<2500)return}
 try{const r=await fetch(dbUrl()+'?t='+Date.now());if(!r.ok)throw 0;const d=await r.json();stat('● 共有中');const rem=d?Object.values(d):[];
  if(snap===null){if(!rem.length){snap={};await sync();return}
   if(S.people.length)try{localStorage.setItem('kazoku-local-backup',JSON.stringify(S.people))}catch(e){}
   S.people=rem;snap=toMap(rem);if(S.base&&!P(S.base))S.base=null;save();render();return}
  const rm={},keep=[];rem.forEach(p=>rm[p.id]=p);
  S.people.forEach(p=>{if(snap[p.id]!==J(p))keep.push(p);else if(rm[p.id])keep.push(rm[p.id])});
  const ids=new Set(keep.map(p=>p.id));rem.forEach(p=>{if(!ids.has(p.id)&&snap[p.id]===undefined)keep.push(p)});
  snap=toMap(rem);
  if(keep.map(J).join('|')!==S.people.map(J).join('|')){S.people=keep;if(S.base&&!P(S.base))S.base=null;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if($('#sh').style.display!=='block')render()}
 }catch(e){stat('△ オフライン')}}
render();
if(DB){stat('接続中…');pull(true)}
setInterval(()=>pull(),4000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
</script></body></html>
